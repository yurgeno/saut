<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="saut-token" content="%%TOKEN%%">
<title>SAUT Studio</title>
<link rel="stylesheet" href="studio.css">
</head><body>

<header class="top">
  <div class="brand">
    <h1>SAUT Studio</h1>
    <span id="mode" class="pill"></span>
    <span id="rootName" class="muted mono"></span>
  </div>
  <nav class="views" aria-label="Views">
    <button class="view-btn active" data-view="overview">Overview</button>
    <button class="view-btn" data-view="skill">Skill</button>
    <button class="view-btn" data-view="bench">Bench</button>
    <button class="view-btn" data-view="harnesses">Harnesses</button>
  </nav>
  <div class="targets" id="targets" title="Target harnesses — the matrix, the findings and the bench follow this choice"></div>
</header>
<div id="guidanceBar" class="guidance-bar"></div>

<main>
  <!-- ── Overview ─────────────────────────────────────────────── -->
  <section id="view-overview" class="view">
    <div class="summary-cards" id="summaryCards"></div>
    <div class="toolbar">
      <input type="search" id="ovFilter" placeholder="Filter by name or description">
      <label class="inline"><input type="checkbox" id="ovOnlyFindings"> only with high or medium findings</label>
      <select id="ovKind"><option value="">skills and agents</option><option value="skill">skills</option><option value="agent">agents</option></select>
      <span class="spacer"></span>
      <button class="btn" id="newSkill">New skill</button>
      <button class="btn" id="newAgent">New agent</button>
    </div>
    <div class="table-wrap"><table class="grid" id="ovTable"></table></div>
    <div id="ovEmpty" class="empty" hidden></div>
  </section>

  <!-- ── Skill ─────────────────────────────────────────────────── -->
  <section id="view-skill" class="view" hidden>
    <div class="skill-head">
      <button class="btn small" id="backToOverview">← Overview</button>
      <button class="btn small" id="prevArtifact" title="previous in the Overview order">‹</button>
      <input list="artifactList" id="artifactPick" placeholder="open a skill or agent…">
      <datalist id="artifactList"></datalist>
      <button class="btn small" id="nextArtifact" title="next in the Overview order">›</button>
      <span id="artifactTitle" class="title"></span>
      <span id="liveBadge" class="pill warn" hidden title="the inspector shows the unsaved text">live — unsaved</span>
    </div>
    <div id="readOnlyBanner" class="banner" hidden></div>

    <div class="workbench">
      <div class="editor-pane">
        <div class="subtabs">
          <button class="subtab active" data-edit="form">Form</button>
          <button class="subtab" data-edit="source">Source</button>
          <span class="muted hint" id="editHint"></span>
        </div>

        <div id="edit-form">
          <div class="card">
            <div class="grid2">
              <div><label for="f_name">name</label><input type="text" id="f_name" placeholder="my-skill"></div>
              <div><label for="f_hint">argument-hint</label><input type="text" id="f_hint" placeholder="&lt;TASK&gt;"></div>
            </div>
            <label for="f_desc">description <span class="muted" id="descCount"></span></label>
            <textarea id="f_desc" rows="3" placeholder="When to use this — the routing sentence. Paid in every session."></textarea>
            <div class="row">
              <label class="inline" id="lbl_userInv"><input type="checkbox" id="f_userInv" checked> user-invocable</label>
              <label class="inline" id="lbl_noModel"><input type="checkbox" id="f_noModel"> disable-model-invocation</label>
              <input type="text" id="f_model" placeholder="model (optional)" class="grow">
              <input type="text" id="f_effort" placeholder="effort (optional)" class="grow">
            </div>
            <label>allowlist <span class="muted" id="allowlistNote"></span></label>
            <div id="toolPills" class="pills"></div>
            <div class="row">
              <select id="toolPick" class="grow"></select>
              <button class="btn small" id="addTool">add</button>
              <input type="text" id="toolScope" placeholder="scope, e.g. git status *" class="grow">
            </div>
            <div id="tautBlock" hidden>
              <label>metadata.taut <span class="muted">— wiring, checked against the pack catalog</span></label>
              <div class="grid2">
                <input type="text" id="f_agents" placeholder="agents: a, b">
                <input type="text" id="f_mcp" placeholder="mcp roles: docs">
              </div>
              <div class="grid3">
                <input type="text" id="f_requires" placeholder="requires: kaut">
                <input type="text" id="f_repos" placeholder="repos: a, b">
                <input type="text" id="f_role" placeholder="role">
              </div>
            </div>
          </div>
          <div class="card editor-card">
            <h2>Body <span class="muted" id="bodyCount"></span></h2>
            <div id="bodyEditor" class="cm-host"></div>
          </div>
        </div>

        <div id="edit-source" hidden>
          <div class="card editor-card">
            <div id="sourceEditor" class="cm-host tall"></div>
          </div>
        </div>
      </div>

      <aside class="inspector">
        <details class="section" open id="secProblems"><summary>Problems <span id="problemCount" class="muted"></span></summary><div id="findings"></div></details>
        <details class="section" open><summary>Harnesses</summary><div id="matrix"></div></details>
        <details class="section" open><summary>Cost</summary><div id="cost"></div></details>
        <details class="section" id="secCompiled"><summary>Compiled <span class="muted">(TAUT)</span></summary><div id="compiledList"></div></details>
      </aside>
    </div>

    <div class="savebar">
      <span class="warn" id="dirtyMark" hidden>● unsaved changes</span>
      <button class="btn primary" id="save">Save…</button>
      <button class="btn" id="revert">Revert</button>
      <span class="muted mono" id="savePath"></span>
      <span class="spacer"></span>
      <span class="muted">Ctrl/⌘+S saves · every save shows the diff first</span>
    </div>
  </section>

  <!-- ── Bench ─────────────────────────────────────────────────── -->
  <section id="view-bench" class="view" hidden>
    <div class="card">
      <div class="row"><span>Artifact: <b id="benchArtifact">— open one in the Skill view</b></span></div>
      <div class="row">
        <select id="benchLevel">
          <option value="1">L1 compile (free)</option>
          <option value="2">L2 + trigger</option>
          <option value="3" selected>L3 + obedience</option>
          <option value="4">L4 + scenario graders</option>
        </select>
        <label class="inline">runs <input type="text" id="benchRuns" value="1" class="narrow"></label>
        <label class="inline">max cost, USD <input type="text" id="benchCost" value="0.50" class="narrow"></label>
      </div>
      <div class="row" id="benchHarnesses"></div>
      <div class="row">
        <button class="btn primary" id="runBench">Run</button>
        <button class="btn" id="validate">Validate pack</button>
      </div>
      <pre id="benchLog" hidden></pre>
      <div id="benchMatrix"></div>
    </div>
  </section>

  <!-- ── Harnesses ─────────────────────────────────────────────── -->
  <section id="view-harnesses" class="view" hidden>
    <div id="harnessCards" class="harness-cards"></div>
  </section>
</main>

<div id="toast" role="status"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <div id="modalNote" class="muted"></div>
    <pre id="modalDiff" class="diff"></pre>
    <div class="row">
      <button class="btn primary" id="modalApply">Apply and save</button>
      <button class="btn" id="modalCancel">Cancel</button>
    </div>
  </div>
</div>

<script type="module" src="studio.js"></script>
</body></html>
