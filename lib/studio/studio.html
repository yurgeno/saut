<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAUT Studio</title>
<style>
  :root { color-scheme: dark;
    --bg: #0f1115; --panel: #151920; --panel2: #10141a; --border: #242b36;
    --text: #dde2ea; --muted: #8a93a3; --accent: #5c8ef2;
    --ok: #3fb076; --warn: #d9a13b; --bad: #e06060; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .mono, textarea, input, select { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .wrap { max-width: 1600px; margin: 0 auto; padding: 18px 22px 40px; }
  h1 { font-size: 15px; font-weight: 650; letter-spacing: .02em; margin: 0; display: inline-block; }
  #sub { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
         color: var(--muted); margin: 5px 0 14px; word-break: break-all; }
  .cols { display: grid; grid-template-columns: 260px minmax(420px, 1fr) minmax(360px, 460px); gap: 16px; align-items: start; }
  @media (max-width: 1180px) { .cols { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .card h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); margin: 0 0 10px; }
  label { display: block; font-size: 11.5px; color: var(--muted); margin: 9px 0 3px; }
  input[type=text], select, textarea { width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; font-size: 12px; }
  textarea { resize: vertical; line-height: 1.55; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn { height: 30px; padding: 0 14px; border-radius: 8px; border: 1px solid #2e3644;
         background: #1b212b; color: var(--text); font: 500 12.5px/1 inherit; cursor: pointer; }
  .btn:hover:not(:disabled) { background: #232b38; border-color: #3b465a; }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary { border-color: #34507f; background: #1c2a44; }
  .list { max-height: 320px; overflow: auto; margin: 0 -4px; }
  .item { display: block; width: 100%; text-align: left; background: transparent; border: none;
          color: var(--text); padding: 5px 8px; border-radius: 6px; cursor: pointer; font: inherit; }
  .item:hover { background: #1b212b; }
  .item.active { background: #1c2a44; }
  .item .k { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
  .pill { display: inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
          border: 1px solid var(--border); color: var(--muted); margin: 0 4px 4px 0; white-space: nowrap; }
  .pill.on { color: #9fc4ff; border-color: #34507f; background: rgba(92,142,242,.1); }
  .pill.ok { color: #6fd49a; border-color: #2b5c42; } .pill.warn { color: #e4b45e; border-color: #6b5620; }
  .pill.bad { color: #ef8b8b; border-color: #6d2f2f; }
  .pill button { background: none; border: none; color: inherit; cursor: pointer; padding: 0 0 0 5px; font: inherit; }
  .find { border-left: 2px solid var(--border); padding: 4px 0 4px 9px; margin: 6px 0; font-size: 12px; }
  .find.high { border-color: var(--bad); } .find.medium { border-color: var(--warn); }
  .find .code { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  pre { background: var(--panel2); border: 1px solid var(--border); border-radius: 7px;
        padding: 9px 11px; overflow: auto; max-height: 340px; font-size: 11.5px; margin: 8px 0 0; }
  .muted { color: var(--muted); } .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 0 0 12px; }
  .tab { padding: 7px 12px 8px; background: transparent; border: none; color: var(--muted);
         font: 500 12.5px/1 inherit; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  #toast { position: fixed; right: 18px; bottom: 18px; background: var(--panel); border: 1px solid var(--border);
           border-radius: 8px; padding: 9px 13px; font-size: 12px; display: none; max-width: 460px; }
  .split { display: grid; grid-template-columns: 1fr; gap: 10px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
  .group h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
              color: var(--muted); margin: 14px 0 2px; }
  .find .title { font-weight: 600; }
  .find .loc { color: var(--accent); cursor: pointer; font-size: 11px; background: none; border: none; padding: 0; font-family: inherit; }
  .find .loc:hover { text-decoration: underline; }
  .find .how { margin-top: 4px; font-size: 11.5px; }
  .find .how b { color: var(--muted); font-weight: 500; }
  .find details { margin-top: 3px; } .find details div { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .find .actions { margin-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .find .actions a { font-size: 11px; color: var(--muted); }
  .find .manual { font-size: 11.5px; color: var(--muted); }
  .find .gmeta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .find .gmeta a { color: var(--muted); }
  #guidanceBar { margin: -6px 0 12px; font-size: 12px; }
  #guidanceBar details { display: inline-block; margin-left: 10px; vertical-align: top; }
  #guidanceBar .packfind { font-size: 11.5px; margin: 4px 0 0 10px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; background: var(--panel2); padding: 0 3px; border-radius: 3px; }
  .btn.small { height: 24px; padding: 0 9px; font-size: 11.5px; }
  .summary { margin: 8px 0 0; font-size: 11.5px; color: var(--muted); }
  .flash { animation: flash 1.4s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 2px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
               width: min(860px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; }
  .modal-box h2 { font-size: 14px; margin: 0 0 6px; }
  pre.diff { max-height: 50vh; white-space: pre-wrap; word-break: break-word; } pre.diff .add { color: var(--ok); } pre.diff .del { color: var(--bad); }
  pre.diff mark { color: inherit; background: rgba(224,96,96,.28); border-radius: 2px; } pre.diff .add mark { background: rgba(63,176,118,.28); }
</style>
</head><body>
<div class="wrap">
  <h1>SAUT Studio</h1> <span id="mode" class="pill"></span>
  <div id="sub" class="mono"></div>
  <div id="guidanceBar"></div>

  <div class="cols">
    <!-- ── left: artifacts ─────────────────────────────────────── -->
    <div>
      <div class="card">
        <h2>Artifacts</h2>
        <div class="row" style="margin-bottom:8px">
          <button class="btn" id="newSkill">New skill</button>
          <button class="btn" id="newAgent">New agent</button>
        </div>
        <div class="list" id="artifacts"></div>
      </div>
      <div class="card">
        <h2>Harnesses</h2>
        <div id="harnesses"></div>
      </div>
    </div>

    <!-- ── middle: form + body ─────────────────────────────────── -->
    <div>
      <div class="card">
        <h2>Frontmatter</h2>
        <div class="split">
          <div class="row">
            <div style="flex:1"><label>name</label><input type="text" id="f_name" placeholder="my-skill"></div>
            <div style="flex:1"><label>argument-hint</label><input type="text" id="f_hint" placeholder="&lt;TASK&gt;"></div>
          </div>
          <div><label>description <span class="muted" id="descCount"></span></label>
               <textarea id="f_desc" rows="3" placeholder="When to use this — the routing sentence. Paid in every session."></textarea></div>
          <div class="row">
            <label style="margin:0"><input type="checkbox" id="f_userInv" checked> user-invocable</label>
            <label style="margin:0"><input type="checkbox" id="f_noModel"> disable-model-invocation</label>
            <div style="flex:1"><input type="text" id="f_model" placeholder="model (optional)"></div>
            <div style="flex:1"><input type="text" id="f_effort" placeholder="effort (optional)"></div>
          </div>
          <div>
            <label>allowed-tools <span class="muted">— what the harness pre-approves; a restriction only where the registry says <code>restrict</code></span></label>
            <div id="toolPills"></div>
            <div class="row">
              <select id="toolPick" style="flex:1"></select>
              <button class="btn" id="addTool">add</button>
              <input type="text" id="toolScope" placeholder="scope, e.g. git status *" style="flex:1">
            </div>
          </div>
          <div id="tautBlock" style="display:none">
            <label>metadata.taut <span class="muted">— wiring, checked against the pack catalog</span></label>
            <div class="row">
              <input type="text" id="f_agents" placeholder="agents: a, b" style="flex:1">
              <input type="text" id="f_mcp" placeholder="mcp roles: docs" style="flex:1">
            </div>
            <div class="row" style="margin-top:6px">
              <input type="text" id="f_requires" placeholder="requires: kaut" style="flex:1">
              <input type="text" id="f_repos" placeholder="repos: a, b" style="flex:1">
              <input type="text" id="f_role" placeholder="role" style="flex:1">
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>Body <span class="muted" id="bodyCount"></span></h2>
        <textarea id="body" rows="20" spellcheck="false" placeholder="# my-skill&#10;&#10;The method. Loaded only when the skill fires."></textarea>
        <div class="row" style="margin-top:9px">
          <button class="btn primary" id="save">Save</button>
          <button class="btn" id="revert">Revert</button>
          <span class="warn" id="dirtyMark" style="display:none">● unsaved changes</span>
          <span class="muted" id="savePath"></span>
        </div>
      </div>
    </div>

    <!-- ── right: passport / bench ─────────────────────────────── -->
    <div>
      <div class="card">
        <div class="tabs">
          <button class="tab active" data-tab="passport">Passport</button>
          <button class="tab" data-tab="compiled">Compiled</button>
          <button class="tab" data-tab="bench">Bench</button>
        </div>

        <div id="tab-passport">
          <div id="cost"></div>
          <div id="matrix"></div>
          <div id="findings"></div>
        </div>

        <div id="tab-compiled" style="display:none">
          <div id="compiledList"></div>
        </div>

        <div id="tab-bench" style="display:none">
          <div class="row">
            <select id="benchLevel">
              <option value="1">L1 compile (free)</option>
              <option value="2">L2 + trigger</option>
              <option value="3" selected>L3 + obedience</option>
              <option value="4">L4 + scenario graders</option>
            </select>
            <input type="text" id="benchRuns" value="1" style="width:64px" title="runs per case">
            <input type="text" id="benchCost" value="0.50" style="width:80px" title="max cost, USD">
          </div>
          <div class="row" style="margin-top:7px" id="benchHarnesses"></div>
          <div class="row" style="margin-top:8px">
            <button class="btn primary" id="runBench">Run</button>
            <button class="btn" id="validate">Validate pack</button>
          </div>
          <pre id="benchLog" style="display:none"></pre>
          <div id="benchMatrix"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <div id="modalNote" class="muted" style="font-size:12px"></div>
    <pre id="modalDiff" class="diff"></pre>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="modalApply">Apply and save</button>
      <button class="btn" id="modalCancel">Cancel</button>
    </div>
  </div>
</div>

<script>
const TOKEN = '%%TOKEN%%';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let ctx = null, current = null, dirty = false, selectedTools = [], benchSel = [];
// Every edit marks the form dirty; anything that would replace the form asks first.
function setDirty(v) { dirty = v; $('dirtyMark').style.display = v ? 'inline' : 'none'; }
function confirmDiscard() {
  if (!dirty) return true;
  const what = (current && current.name) || $('f_name').value.trim() || 'this artifact';
  return confirm('Unsaved changes to ' + what + ' will be lost. Discard them?');
}

function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  t.style.borderColor = bad ? '#6d2f2f' : '#242b36';
  clearTimeout(t._h); t._h = setTimeout(() => { t.style.display = 'none'; }, 5200);
}
// Every /api route requires the token, reads included — so GETs carry the header too.
async function api(path, body) {
  const r = await fetch(path, body === undefined ? { headers: { 'x-saut-token': TOKEN } } : {
    method: 'POST', headers: { 'content-type': 'application/json', 'x-saut-token': TOKEN }, body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({ error: 'bad response' }));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

// ── context ───────────────────────────────────────────────────────
function drawGuidanceBar() {
  const g = ctx.guidance;
  if (!g) { $('guidanceBar').innerHTML = ''; return; }
  const age = g.ageDays === 0 ? 'today' : g.ageDays === 1 ? '1 day ago' : g.ageDays + ' days ago';
  const parts = g.parts.map((p) => esc(p.what) + ' ' + esc(p.verifiedAt) + (p.stale ? ' (stale)' : '')).join(' · ');
  let html = '<span class="pill ' + (g.stale ? 'warn' : 'ok') + '" title="' + parts + '">vendor guidance verified ' + esc(g.verifiedAt) + ' · ' + age + '</span>' +
    (g.stale ? ' <span class="warn">older than ' + g.maxAgeDays + ' days — re-verify: <code>saut guidance</code></span>' : '');
  const pf = ctx.packFindings || [];
  if (pf.length) html += '<details><summary class="' + (pf.some((f) => f.severity === 'high') ? 'bad' : 'warn') + '">pack model ladder: ' + pf.length + ' finding' + (pf.length === 1 ? '' : 's') + '</summary>' +
    pf.map((f) => '<div class="packfind"><span class="code">' + esc(f.code) + (f.line ? ' · deployment.json:' + f.line : '') + '</span> — ' + md(f.message) + '</div>').join('') + '</details>';
  $('guidanceBar').innerHTML = html;
}

async function loadContext() {
  ctx = await api('/api/context');
  drawGuidanceBar();
  $('mode').textContent = ctx.taut ? 'TAUT pack' : 'generic';
  $('mode').className = 'pill ' + (ctx.taut ? 'on' : '');
  $('sub').textContent = ctx.root + (ctx.taut ? '  ·  engine ' + ctx.taut.engine + (ctx.taut.engineCommit ? ' @' + ctx.taut.engineCommit : '') + (ctx.taut.deployment ? '  ·  deployment ' + ctx.taut.deployment : '') : '') + (ctx.note ? '  ·  ' + ctx.note : '');
  $('tautBlock').style.display = ctx.taut ? 'block' : 'none';
  drawArtifacts(); drawHarnesses(); drawToolPicker(); drawBenchHarnesses();
}

function drawArtifacts() {
  const el = $('artifacts'); el.innerHTML = '';
  for (const a of ctx.artifacts) {
    const b = document.createElement('button');
    b.className = 'item' + (current && current.path === a.path ? ' active' : '');
    b.innerHTML = '<span class="k">' + a.kind + '</span> ' + esc(a.name);
    b.onclick = () => { if (confirmDiscard()) openArtifact(a.path).catch((e) => toast(e.message, true)); };
    el.appendChild(b);
  }
  if (!ctx.artifacts.length) el.innerHTML = '<div class="muted">nothing found under this root</div>';
}

function drawHarnesses() {
  $('harnesses').innerHTML = ctx.harnesses.map((h) => {
    const sem = h.toolAllowlist;
    const cls = sem === 'restrict' ? 'ok' : sem === 'grant' ? 'warn' : 'bad';
    return '<div style="margin-bottom:7px"><b>' + esc(h.id) + '</b> ' + (h.runner ? '' : '<span class="pill">no runner</span>') +
      '<br><span class="pill ' + cls + '">skills: ' + esc(sem) + '</span><span class="pill">agents: ' + esc(h.agentAllowlist) + '</span>' +
      (h.degradations.length ? '<details><summary>' + h.degradations.length + ' recorded degradation(s)</summary>' +
        h.degradations.map((d) => '<div class="muted" style="margin:4px 0">' + esc(d.id) + ': ' + esc(d.text) + '</div>').join('') + '</details>' : '') + '</div>';
  }).join('');
}

function allToolNames() {
  const set = new Set();
  for (const list of Object.values(ctx.tools.builtin)) for (const t of list) if (/^[A-Z]/.test(t)) set.add(t);
  for (const s of ctx.tools.servers) for (const t of s.tools) set.add(t);
  return [...set].sort();
}
function drawToolPicker() {
  $('toolPick').innerHTML = allToolNames().map((t) => '<option>' + esc(t) + '</option>').join('');
}
function drawTools() {
  $('toolPills').innerHTML = selectedTools.map((t, i) =>
    '<span class="pill on">' + esc(t) + '<button data-i="' + i + '">×</button></span>').join('') || '<span class="muted">none — the skill gets the full toolset</span>';
  for (const b of $('toolPills').querySelectorAll('button')) b.onclick = () => { selectedTools.splice(+b.dataset.i, 1); drawTools(); setDirty(true); };
}
function drawBenchHarnesses() {
  const runnable = ctx.harnesses.filter((h) => h.runner);
  if (!benchSel.length) benchSel = runnable.map((h) => h.id);
  $('benchHarnesses').innerHTML = runnable.map((h) =>
    '<label style="margin:0"><input type="checkbox" data-h="' + esc(h.id) + '"' + (benchSel.includes(h.id) ? ' checked' : '') + '> ' + esc(h.id) + '</label>').join(' ');
  for (const c of $('benchHarnesses').querySelectorAll('input')) c.onchange = () => {
    benchSel = [...$('benchHarnesses').querySelectorAll('input')].filter((x) => x.checked).map((x) => x.dataset.h);
  };
}

// ── artifact ──────────────────────────────────────────────────────
async function openArtifact(p) {
  const pass = await api('/api/artifact?path=' + encodeURIComponent(p));
  current = pass;
  const fm = pass.frontmatter || {};
  $('f_name').value = fm.name || pass.name || '';
  $('f_desc').value = fm.description || '';
  $('f_hint').value = fm['argument-hint'] || '';
  $('f_userInv').checked = fm['user-invocable'] !== false;
  $('f_noModel').checked = fm['disable-model-invocation'] === true;
  $('f_model').value = fm.model || '';
  $('f_effort').value = fm.effort || '';
  const key = pass.kind === 'agent' ? 'tools' : 'allowed-tools';
  const raw = fm[key];
  selectedTools = Array.isArray(raw) ? raw.slice() : (typeof raw === 'string' && raw.trim() ? raw.split(',').map((x) => x.trim()) : []);
  const w = (fm.metadata && typeof fm.metadata === 'object' && fm.metadata.taut) || {};
  $('f_agents').value = (w.agents || []).join(', ');
  $('f_mcp').value = (w.mcp || []).join(', ');
  $('f_requires').value = (w.requires || []).join(', ');
  $('f_repos').value = (w.repos || []).join(', ');
  $('f_role').value = w.role || '';
  const body = pass.text.replace(/^---\n[\s\S]*?\n---\n?/, '');
  $('body').value = body;
  $('savePath').textContent = pass.path;
  setDirty(false);
  drawTools(); drawArtifacts(); drawPassport(pass); drawCompiled(pass);
  counts();
}

function counts() {
  const d = $('f_desc').value.length;
  const cap = (ctx.harnesses.find((h) => h.id === 'claude-code') || {}).listing;
  $('descCount').textContent = '— ' + d + ' chars' + (cap && cap.descCap ? ' / ' + cap.descCap : '') + ', paid every session';
  $('descCount').className = cap && cap.descCap && d > cap.descCap ? 'bad' : 'muted';
  $('bodyCount').textContent = '— ' + $('body').value.length + ' chars, on invoke';
}

const ALLOWLIST_MEANS = {
  restrict: 'the allowlist restricts: tools outside it are unavailable',
  grant: 'the allowlist only pre-approves; every other tool is still available',
  prose: 'the allowlist is text for the model; nothing enforces it',
  dropped: 'the allowlist is removed when the artifact is installed',
  'n/a': 'the harness has no allowlist for this kind of artifact',
};
function drawPassport(p) {
  const tr = p.cost.transitive || [];
  const inv = p.cost.invokeTokens + tr.reduce((s, t) => s + t.tokens, 0);
  $('cost').innerHTML = '<table><tr><th>always-on</th><th>on-invoke</th><th>method</th></tr>' +
    '<tr><td>' + p.cost.alwaysOnTokens + ' tok</td><td>' + inv + ' tok' + (tr.length ? ' <span class="muted">(incl. ' + tr.map((t) => esc(t.name)).join(', ') + ')</span>' : '') + '</td><td class="muted">' + p.cost.method + '</td></tr></table>';
  $('matrix').innerHTML = '<div style="margin:9px 0">' + p.matrix.map((m) =>
    '<span class="pill ' + (m.allowlist === 'restrict' ? 'ok' : m.allowlist === 'grant' ? 'warn' : 'bad') + '" title="' + esc(ALLOWLIST_MEANS[m.allowlist] || '') + '">' + esc(m.harness) + ' = ' + esc(m.allowlist) + '</span>').join('') + '</div>';
  drawFindings(p);
}

// ── findings: grouped, each with why / how to fix / a previewable mechanical fix ──
const CATEGORIES = [['security', 'Security'], ['guidance', 'Current guidance'], ['privileges', 'Privileges'], ['hygiene', 'Hygiene and cost'],
  ['syntax', 'Syntax'], ['taut', 'TAUT wiring'], ['scanner', 'Content scanner'], ['other', 'Other']];
// inline `code` in rule text → <code>; everything else escaped
const md = (t) => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>');

function drawFindings(p) {
  const fs = p.findings;
  if (!fs.length) { $('findings').innerHTML = '<div class="ok" style="margin-top:8px">no findings</div>'; return; }
  const hi = fs.filter((f) => f.severity === 'high').length;
  const fixable = fs.filter((f) => f.autofix).length;
  let html = '<div class="summary">' + fs.length + ' finding' + (fs.length === 1 ? '' : 's') + ' · ' + hi + ' high · ' + fixable + ' with a fix</div>';
  for (const [cat, label] of CATEGORIES) {
    const items = fs.map((f, i) => [f, i]).filter(([f]) => (f.category || 'other') === cat);
    if (!items.length) continue;
    html += '<div class="group"><h3>' + label + ' · ' + items.length + '</h3>' + items.map(([f, i]) => findingCard(f, i)).join('') + '</div>';
  }
  $('findings').innerHTML = html;
  for (const b of $('findings').querySelectorAll('.loc')) b.onclick = () => goToLine(+b.dataset.line);
  for (const b of $('findings').querySelectorAll('.fixbtn')) b.onclick = () => previewFix(fs[+b.dataset.i]);
}

// Vendor-guidance findings say which class they are, how fresh the data is and where it came from.
const CLASS_PILL = {
  A: '<span class="pill bad" title="an outdated setting — fix it">A · outdated</span>',
  B: '<span class="pill warn" title="a prompt-level hypothesis — vendors say to change prompts only against a measurement">B · measure before changing</span>',
  D: '<span class="pill on" title="a hardening the artifact does not use yet">D · hardening</span>',
};
function guidanceMeta(g) {
  const links = (g.sources || []).map((u) => /^https?:\/\//.test(u)
    ? '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(u.replace(/^https?:\/\//, '').split('/')[0]) + '</a>'
    : '<span title="' + esc(u) + '">' + esc(u.split(' ')[0].replace(/:$/, '')) + '</span>').join(' · ');
  return '<div class="gmeta">' + (CLASS_PILL[g.class] || '') + ' verified ' + esc(g.verifiedAt || '?') +
    (g.appliesTo ? ' · for ' + esc(g.appliesTo) : '') + (links ? ' · ' + links : '') +
    (g.class === 'B' ? '<div>Change it with a bench before and after (Bench tab), one change at a time.</div>' : '') + '</div>';
}

function findingCard(f, i) {
  const where = f.line ? ' <button class="loc" data-line="' + f.line + '" title="show in the editor">line ' + f.line + '</button>' : '';
  const safety = f.autofix ? (f.autofix.safety === 'review'
    ? '<span class="pill warn" title="changes what the artifact may do, or rests on a heuristic — read the diff">review</span>'
    : '<span class="pill ok" title="mechanical, behaviour-preserving">safe</span>') : '';
  return '<div class="find ' + esc(f.severity) + '">' +
    '<div><span class="title">' + esc(f.title || f.code) + '</span> <span class="code">' + esc(f.code) + (f.harness ? ' [' + esc(f.harness) + ']' : '') + '</span>' + where + '</div>' +
    '<div>' + md(f.message) + '</div>' +
    (f.fix ? '<div class="how"><b>How to fix:</b> ' + md(f.fix) + '</div>' : '') +
    (f.guidance ? guidanceMeta(f.guidance) : '') +
    (f.why ? '<details><summary>why it matters</summary><div>' + md(f.why) + '</div></details>' : '') +
    '<div class="actions">' +
      (f.autofix ? '<button class="btn small fixbtn" data-i="' + i + '">' + esc(f.autofix.label) + '</button>' + safety
        : '<span class="manual">No automatic fix — ' + (f.line ? 'edit <button class="loc" data-line="' + f.line + '">line ' + f.line + '</button> by hand' : 'edit the artifact by hand') + '.</span>') +
      (f.heuristic ? '<span class="pill" title="this rule reads prose or patterns; read the line before acting">heuristic — can be a false positive</span>' : '') +
      (f.doc ? '<a href="' + esc(f.doc) + '" target="_blank" rel="noopener noreferrer">rule ↗</a>' : '') +
    '</div></div>';
}

// A finding's line → the form field it belongs to (frontmatter) or the body line itself.
const FIELD_FOR = { name: 'f_name', description: 'f_desc', 'argument-hint': 'f_hint', 'allowed-tools': 'toolPills', tools: 'toolPills',
  'disallowed-tools': 'toolPills', 'disable-model-invocation': 'f_noModel', 'user-invocable': 'f_userInv', model: 'f_model',
  effort: 'f_effort', metadata: 'tautBlock' };
function flash(el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function goToLine(line) {
  if (!current || !current.bodyOffset) return;
  if (line < current.bodyOffset) {
    const key = Object.entries(current.lines || {}).filter(([, n]) => n <= line).sort((a, b) => b[1] - a[1])[0]?.[0];
    const el = $(FIELD_FOR[key] || 'f_name');
    if (!el || el.offsetParent === null) return toast('line ' + line + ' is in the frontmatter (' + (key || '?') + ')');
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    if (el.focus) el.focus({ preventScroll: true });
    flash(el.closest('.row') && el.type === 'checkbox' ? el.closest('label') : el);
    return;
  }
  const ta = $('body');
  const idx = line - current.bodyOffset;
  const ls = ta.value.split('\n');
  if (idx >= ls.length) return;
  const start = ls.slice(0, idx).reduce((n, l) => n + l.length + 1, 0);
  ta.scrollIntoView({ block: 'center', behavior: 'smooth' });
  ta.focus({ preventScroll: true });
  ta.setSelectionRange(start, start + ls[idx].length);
  const lh = parseFloat(getComputedStyle(ta).lineHeight) || 18;
  ta.scrollTop = Math.max(0, idx * lh - ta.clientHeight / 3);
  flash(ta);
}

// ── fix: preview the diff, then apply (the server re-checks the fix is still proposed) ──
let pendingFix = null;
// A removed line followed by its replacement: mark the part that changed, so a one-word edit
// in a long allowlist line is visible without reading both lines character by character.
function diffHtml(d) {
  const ls = d.split('\n');
  const out = ls.map((l) => ({ cls: l.startsWith('+') ? 'add' : l.startsWith('-') ? 'del' : 'muted', html: esc(l) }));
  for (let i = 0; i + 1 < ls.length; i++) {
    if (!ls[i].startsWith('-') || !ls[i + 1].startsWith('+')) continue;
    const gut = (l) => (l.match(/^[-+] *\d+ {2}/) || [''])[0].length;   // the "- NNN  " gutter
    const ga = gut(ls[i]), gb = gut(ls[i + 1]);
    const a = ls[i].slice(ga), b = ls[i + 1].slice(gb);
    let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
    let q = 0; while (q < a.length - p && q < b.length - p && a[a.length - 1 - q] === b[b.length - 1 - q]) q++;
    const mark = (line, g, s) => esc(line.slice(0, g + p)) + '<mark>' + esc(s.slice(p, s.length - q)) + '</mark>' + esc(s.slice(s.length - q));
    out[i].html = mark(ls[i], ga, a); out[i + 1].html = mark(ls[i + 1], gb, b);
  }
  return out.map((o) => '<span class="' + o.cls + '">' + o.html + '</span>').join('\n');
}
function closeModal() { $('modal').style.display = 'none'; pendingFix = null; }
async function previewFix(f) {
  if (!current || !current.path || !f.autofix) return;
  try {
    const r = await api('/api/fix', { path: current.path, autofix: f.autofix });
    if (!r.ok) return toast('cannot apply: ' + r.reason, true);
    pendingFix = { autofix: f.autofix, base: r.base };
    $('modalTitle').textContent = f.autofix.label;
    $('modalNote').innerHTML = (f.autofix.safety === 'review'
      ? '<span class="warn">Review.</span> This changes what the artifact may do, or rests on a heuristic that can be wrong for this artifact — check the body before applying. '
      : 'A mechanical, behaviour-preserving change. ') +
      (dirty ? '<span class="bad">You have unsaved edits — save or revert them first.</span>' : 'Applying writes the file and re-lints it.');
    $('modalDiff').innerHTML = diffHtml(r.diff);
    $('modalApply').disabled = dirty;
    $('modal').style.display = 'flex';
    $('modalApply').focus();
  } catch (e) { toast(e.message, true); }
}
$('modalCancel').onclick = closeModal;
$('modal').onclick = (e) => { if (e.target === $('modal')) closeModal(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('modal').style.display === 'flex') closeModal(); });
$('modalApply').onclick = async () => {
  if (!pendingFix || !current) return;
  const fix = pendingFix;
  try {
    const r = await api('/api/fix', { path: current.path, autofix: fix.autofix, base: fix.base, apply: true });
    closeModal();
    await openArtifact(current.path);     // the form and the passport come back from disk
    toast('applied: ' + r.label);
  } catch (e) { toast(e.message, true); }
};

function drawCompiled(p) {
  if (!p.compiled || !p.compiled.length) { $('compiledList').innerHTML = '<div class="muted">compile previews need a TAUT pack and engine</div>'; return; }
  $('compiledList').innerHTML = p.compiled.map((c) =>
    '<details><summary><b>' + esc(c.harness) + '</b> → ' + esc(c.id) + ' <span class="muted">' + c.bytes + ' bytes · ' + esc(c.transform) + '</span></summary>' +
    c.degradations.map((d) => '<div class="warn" style="margin:5px 0;font-size:11.5px">' + esc(d.id) + ': ' + esc(d.text) + '</div>').join('') +
    '<pre>' + esc(c.content) + '</pre></details>').join('');
}

// ── save ──────────────────────────────────────────────────────────
function frontmatterFromForm() {
  const fm = {};
  fm.name = $('f_name').value.trim();
  if ($('f_desc').value.trim()) fm.description = $('f_desc').value.trim().replace(/\s*\n\s*/g, ' ');
  if ($('f_hint').value.trim()) fm['argument-hint'] = $('f_hint').value.trim();
  const isAgent = current && current.kind === 'agent';
  if (!isAgent) {
    if (!$('f_userInv').checked) fm['user-invocable'] = false;
    if ($('f_noModel').checked) fm['disable-model-invocation'] = true;
  }
  if (selectedTools.length) fm[isAgent ? 'tools' : 'allowed-tools'] = selectedTools;
  if ($('f_model').value.trim()) fm.model = $('f_model').value.trim();
  if ($('f_effort').value.trim()) fm.effort = $('f_effort').value.trim();
  if (ctx.taut && !isAgent) {
    const list = (id) => $(id).value.split(',').map((x) => x.trim()).filter(Boolean);
    const w = {};
    if (list('f_agents').length) w.agents = list('f_agents');
    if (list('f_mcp').length) w.mcp = list('f_mcp');
    if (list('f_requires').length) w.requires = list('f_requires');
    if (list('f_repos').length) w.repos = list('f_repos');
    if ($('f_role').value.trim()) w.role = $('f_role').value.trim();
    if (Object.keys(w).length) fm.metadata = { taut: w };
  }
  return fm;
}

$('save').onclick = async () => {
  try {
    const r = await api('/api/save', {
      kind: current ? current.kind : 'skill',
      name: $('f_name').value.trim(),
      path: current ? current.path : null,
      project: ctx.taut && ctx.taut.deployment ? null : null,
      frontmatter: frontmatterFromForm(),
      body: $('body').value,
    });
    toast((r.created ? 'created ' : 'saved ') + r.path);
    await loadContext();
    current = r.passport; drawPassport(r.passport); drawCompiled(r.passport);
    $('savePath').textContent = r.path; setDirty(false);
  } catch (e) { toast(e.message, true); }
};
$('revert').onclick = () => { if (current && current.path && confirmDiscard()) openArtifact(current.path).catch((e) => toast(e.message, true)); };

$('newSkill').onclick = () => { if (confirmDiscard()) newArtifact('skill'); };
$('newAgent').onclick = () => { if (confirmDiscard()) newArtifact('agent'); };
function newArtifact(kind) {
  current = { kind, path: null, name: '', compiled: [] };
  $('f_name').value = ''; $('f_desc').value = ''; $('f_hint').value = '';
  $('f_userInv').checked = true; $('f_noModel').checked = kind === 'skill';
  $('f_model').value = ''; $('f_effort').value = '';
  $('f_agents').value = ''; $('f_mcp').value = ''; $('f_requires').value = ''; $('f_repos').value = ''; $('f_role').value = '';
  selectedTools = ['Read', 'Glob', 'Grep'];
  $('body').value = '# \n\nThe method.\n';
  $('savePath').textContent = '(new — saved into ' + (kind === 'agent' ? 'agents/' : 'skills/<name>/') + ')';
  drawTools(); $('findings').innerHTML = '<div class="muted">save to lint</div>';
  $('cost').innerHTML = ''; $('matrix').innerHTML = ''; $('compiledList').innerHTML = '';
  setDirty(false); drawArtifacts();
  counts();
}

$('addTool').onclick = () => {
  const base = $('toolPick').value; const scope = $('toolScope').value.trim();
  const entry = scope ? base + '(' + scope + ')' : base;
  if (!selectedTools.includes(entry)) selectedTools.push(entry);
  $('toolScope').value = ''; setDirty(true); drawTools();
};
for (const id of ['f_name', 'f_hint', 'f_desc', 'f_model', 'f_effort', 'f_agents', 'f_mcp', 'f_requires', 'f_repos', 'f_role', 'body'])
  $(id).addEventListener('input', () => { setDirty(true); counts(); });
for (const id of ['f_userInv', 'f_noModel']) $(id).addEventListener('change', () => setDirty(true));

// ── tabs ──────────────────────────────────────────────────────────
for (const t of document.querySelectorAll('.tab')) t.onclick = () => {
  for (const x of document.querySelectorAll('.tab')) x.classList.toggle('active', x === t);
  for (const name of ['passport', 'compiled', 'bench']) $('tab-' + name).style.display = name === t.dataset.tab ? 'block' : 'none';
};

// ── bench ─────────────────────────────────────────────────────────
$('runBench').onclick = async () => {
  if (!current || !current.path) return toast('save the artifact first', true);
  $('benchLog').style.display = 'block'; $('benchLog').textContent = ''; $('benchMatrix').innerHTML = '';
  $('runBench').disabled = true;
  try {
    const { id } = await api('/api/test', {
      path: current.path, level: +$('benchLevel').value, runs: +$('benchRuns').value,
      maxCost: $('benchCost').value.trim() === '' ? null : +$('benchCost').value, harnesses: benchSel,
    });
    const es = new EventSource('/api/test/' + id + '/events?token=' + TOKEN);
    es.onmessage = (ev) => {
      const e = JSON.parse(ev.data);
      $('benchLog').textContent += e.kind.padEnd(7) + ' ' + e.text + '\n';
      $('benchLog').scrollTop = $('benchLog').scrollHeight;
    };
    es.addEventListener('end', (ev) => {
      es.close(); $('runBench').disabled = false;
      const { result, error } = JSON.parse(ev.data);
      if (error) return toast(error, true);
      if (result) drawBenchMatrix(result);
    });
    es.onerror = () => { es.close(); $('runBench').disabled = false; };
  } catch (e) { $('runBench').disabled = false; toast(e.message, true); }
};

function scenarioCell(sc) {
  if (!sc || sc.score === null) return '<span class="muted">' + (sc && !sc.graded ? 'no graders' : '—') + '</span>';
  const pct = Math.round(sc.score * 100) + '%';
  return '<span class="' + (sc.score === 1 ? 'ok' : 'bad') + '">' + pct + '</span>' + (sc.failed.length ? ' <span class="muted">(' + esc(sc.failed.join(', ')) + ')</span>' : '');
}

function drawBenchMatrix(r) {
  const pct = (x) => x === null ? '—' : Math.round(x * 100) + '%';
  const l4 = r.levels.includes(4);
  let html = '<table><tr><th>harness</th><th>trigger</th><th>control</th><th>obedience</th>' + (l4 ? '<th>scenario</th>' : '') + '</tr>';
  for (const rep of r.reports) {
    if (!rep.available) { html += '<tr><td>' + esc(rep.harness) + '</td><td colspan="' + (l4 ? 4 : 3) + '" class="muted">' + esc(rep.reason || 'unavailable') + '</td></tr>'; continue; }
    const ob = rep.obedience;
    html += '<tr><td>' + esc(rep.harness) + '</td>' +
      '<td class="' + (rep.trigger.fireRate ? 'ok' : 'bad') + '">' + pct(rep.trigger.fireRate) + (rep.trigger.lostTo.length ? ' <span class="warn">lost to ' + esc(rep.trigger.lostTo.join(', ')) + '</span>' : '') + '</td>' +
      '<td class="' + (rep.trigger.controlClean === false ? 'bad' : 'ok') + '">' + (rep.trigger.controlClean === null ? '—' : rep.trigger.controlClean ? 'clean' : 'FIRED') + '</td>' +
      '<td>' + (ob ? (ob.violations.length ? '<span class="bad">' + ob.violations.length + ' outside</span>' : '<span class="ok">inside</span>') + ' <span class="muted">[' + esc(ob.enforcement) + ']</span>' : '—') + '</td>' +
      (l4 ? '<td>' + scenarioCell(rep.scenario) + '</td>' : '') + '</tr>';
    if (ob && ob.violations.length) html += '<tr><td></td><td colspan="' + (l4 ? 4 : 3) + '" class="warn" style="font-size:11px">' + esc(ob.violations.join(' · ')) + '</td></tr>';
  }
  html += '</table><div class="muted" style="margin-top:6px">L1 ' + (r.compiled.ok ? '<span class="ok">ok</span>' : '<span class="bad">FAIL</span>') + ' ' + esc(r.compiled.detail) + '</div>';
  $('benchMatrix').innerHTML = html;
}

$('validate').onclick = async () => {
  $('validate').disabled = true; $('benchLog').style.display = 'block'; $('benchLog').textContent = 'running…';
  try {
    const r = await api('/api/validate', {});
    $('benchLog').textContent = r.command + '\n\n' + r.output;
    toast(r.command + (r.ok ? ' — green' : ' — FAILED'), !r.ok);
  } catch (e) { toast(e.message, true); } finally { $('validate').disabled = false; }
};

window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
loadContext().catch((e) => toast(e.message, true));
</script>
</body></html>
